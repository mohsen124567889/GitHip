<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10"><meta name="description" content="Mivo Social - تواصل يجمعك">
<link rel="manifest" href="manifest.json"><title>Mivo Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080b10;--panel:#10151d;--panel2:#151c26;--line:#232c38;--text:#edf3f8;--muted:#8794a5;--green:#20d49a;--gold:#d8b56a;--danger:#ff5e75}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:4;background:#080b10eF;backdrop-filter:blur(18px);padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:24px;letter-spacing:-.5px}.brand span{color:var(--green)}.topactions{display:flex;gap:9px}.iconbtn{width:39px;height:39px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}.stories{display:flex;gap:12px;padding:16px;overflow:auto;border-bottom:1px solid var(--line)}.story{min-width:65px;text-align:center;font-size:12px;color:var(--muted)}.ring{width:57px;height:57px;border-radius:50%;padding:3px;margin:auto auto 6px;background:linear-gradient(135deg,var(--green),var(--gold))}.ring img,.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#273342}.ring .avatar{border:2px solid var(--bg)}.feed{padding:14px;display:grid;gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:13px}.avatar{width:42px;height:42px;flex-shrink:0}.name{font-weight:800}.handle{color:var(--muted);font-size:12px}.posttext{padding:0 14px 12px;line-height:1.8}.postimg{width:100%;max-height:430px;object-fit:cover;display:block;background:#0d1219}.actions{display:flex;align-items:center;gap:7px;padding:10px 12px;border-top:1px solid var(--line)}.act{background:transparent;padding:8px 10px;border-radius:12px;color:var(--muted)}.act.liked{color:#ff597b}.spacer{flex:1}.small{font-size:12px;color:var(--muted)}.composer{margin:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px}.composer textarea{width:100%;background:transparent;border:0;outline:0;color:var(--text);resize:vertical;min-height:65px}.row{display:flex;align-items:center;gap:9px}.primary{background:var(--green);color:#04130e;font-weight:800;border-radius:13px;padding:10px 16px}.secondary{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px 13px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#0b1018f2;border-top:1px solid var(--line);backdrop-filter:blur(20px);display:flex;justify-content:center}.navin{max-width:680px;width:100%;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom))}.nav button{background:none;color:var(--muted);display:grid;gap:3px;place-items:center;font-size:11px;min-width:54px}.nav button b{font-size:21px;font-weight:500}.nav button.active{color:var(--green)}.view{padding:18px}.sectiontitle{font-size:22px;font-weight:800;margin:8px 0 15px}.field{width:100%;background:#0b1017;border:1px solid var(--line);color:var(--text);padding:13px;border-radius:13px;margin:7px 0;outline:none}.empty{text-align:center;padding:50px 20px;color:var(--muted)}.profilehero{text-align:center;padding:25px}.profilehero .avatar{width:85px;height:85px;margin:0 auto 12px}.statrow{display:flex;justify-content:center;gap:30px;margin:15px}.statrow strong{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;width:min(680px,100%);max-height:85vh;overflow:auto}.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#17242b;border:1px solid #2b5949;padding:12px 18px;border-radius:14px;z-index:30;display:none}.toast.show{display:block}.badge{background:#183b30;color:var(--green);padding:4px 8px;border-radius:9px;font-size:12px}
</style></head><body>
<div class="app"><header class="top"><div class="brand">Mivo <span>Social</span></div><div class="topactions"><button class="iconbtn" onclick="openNotifications()" aria-label="الإشعارات">♧</button><button class="iconbtn" onclick="showMessages()" aria-label="الرسائل">✉</button></div></header>
<main id="main"><div class="stories" id="stories"></div><div class="composer"><div class="row"><img class="avatar" src="https://i.pravatar.cc/100?img=12"><textarea id="postText" placeholder="وش يدور في بالك؟"></textarea></div><div class="row"><button class="secondary" onclick="pickImage()">＋ صورة</button><input id="imageFile" type="file" accept="image/*" hidden onchange="previewImage(event)"><span class="small" id="imageLabel"></span><span class="spacer"></span><button class="primary" onclick="publishPost()">نشر</button></div></div><div class="feed" id="feed"></div></main></div>
<nav class="nav"><div class="navin"><button class="active" onclick="go('home',this)"><b>⌂</b>الرئيسية</button><button onclick="go('search',this)"><b>⌕</b>بحث</button><button onclick="go('reels',this)"><b>▷</b>مقاطع</button><button onclick="go('communities',this)"><b>♧</b>مجتمعات</button><button onclick="go('profile',this)"><b>◉</b>حسابي</button></div></nav>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, updateDoc, increment, setDoc, getDocs, limit } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js";
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};
let app,auth,db,storage,user=null,unsubscribe=null,chosenImage=null;
const demoPosts=[
 {id:"demo1",name:"سارة العتيبي",handle:"sara",text:"بداية يوم جميل ✨ شاركوني خططكم اليوم!",likes:18,comments:4,img:"https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=900&q=80"},
 {id:"demo2",name:"عبدالله",handle:"abdullah",text:"مساء الخير للجميع 💚",likes:7,comments:2}
];
window.toast=(s)=>{let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};
window.pickImage=()=>document.getElementById('imageFile').click();
window.previewImage=e=>{chosenImage=e.target.files[0];document.getElementById('imageLabel').textContent=chosenImage?.name||''};
function avatar(seed){return `https://i.pravatar.cc/100?img=${seed||12}`}
function renderStories(){document.getElementById('stories').innerHTML=[["قصتك",12],["نورة",44],["محمد",13],["ريم",32],["سلمان",8],["ليان",21]].map((s,i)=>`<div class="story" onclick="toast('القصص ستُفعّل مع الحسابات')"><div class="ring"><img class="avatar" src="${avatar(s[1])}"></div>${s[0]}</div>`).join('')}
function renderPosts(posts){document.getElementById('feed').innerHTML=posts.map(p=>`<article class="card"><div class="posthead"><img class="avatar" src="${p.avatar||avatar(p.seed||18)}"><div><div class="name">${esc(p.name||'مستخدم Mivo')}</div><div class="handle">@${esc(p.handle||'user')} · ${p.createdAt?.toDate?p.createdAt.toDate().toLocaleDateString('ar-SA'):'الآن'}</div></div><span class="spacer"></span><button class="act" onclick="toast('خيارات المنشور')">•••</button></div>${p.text?`<div class="posttext">${esc(p.text)}</div>`:''}${p.image?`<img class="postimg" src="${p.image}">`:p.img?`<img class="postimg" src="${p.img}">`:''}<div class="actions"><button class="act ${p.liked?'liked':''}" onclick="likePost('${p.id}')">♡ ${p.likes||0}</button><button class="act" onclick="commentPost('${p.id}')">◷ ${p.comments||0}</button><button class="act" onclick="toast('تم نسخ رابط المنشور (تجريبي)')">↗ مشاركة</button><span class="spacer"></span><button class="act" onclick="toast('حفظ المنشور')">⌑</button></div></article>`).join('')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
renderStories();renderPosts(demoPosts);
window.publishPost=async()=>{let text=document.getElementById('postText').value.trim();if(!text&&!chosenImage)return toast('اكتب شيئًا أو اختر صورة');if(!user||!db)return toast('سجّل الدخول واربط Firebase أولًا');try{let image='';if(chosenImage){let r=ref(storage,`posts/${user.uid}/${Date.now()}_${chosenImage.name}`);await uploadBytes(r,chosenImage);image=await getDownloadURL(r)}await addDoc(collection(db,'posts'),{uid:user.uid,name:user.displayName||user.email.split('@')[0],handle:user.email.split('@')[0],text,image,likes:0,comments:0,createdAt:serverTimestamp()});document.getElementById('postText').value='';chosenImage=null;document.getElementById('imageLabel').textContent='';toast('تم نشر المنشور')}catch(e){toast('تعذر النشر: '+e.message)}};
window.likePost=async id=>{if(id.startsWith('demo'))return toast('الإعجاب التجريبي');if(!user)return toast('سجّل الدخول');try{await updateDoc(doc(db,'posts',id),{likes:increment(1)});toast('تم الإعجاب')}catch(e){toast(e.message)}};
window.commentPost=id=>{openSheet(`<h2>التعليقات</h2><p class="small">سيتم ربط التعليقات بقاعدة Firestore عند تفعيلها.</p><input class="field" placeholder="اكتب تعليقك"><button class="primary" onclick="toast('أضفنا واجهة التعليقات');closeModal()">إرسال</button>`)};
window.openSheet=html=>{document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')};window.closeModal=()=>document.getElementById('modal').classList.remove('show');
window.openNotifications=()=>openSheet(`<h2>الإشعارات</h2><div class="empty">🔔<br>لا توجد إشعارات الآن<br><small>الإشعارات الحقيقية تتطلب إعداد FCM وCloud Functions.</small></div>`);
window.showMessages=()=>openSheet(`<h2>الرسائل</h2><p>المحادثات الخاصة ستكون لحظية بعد تفعيل Firebase.</p><button class="primary" onclick="authPanel()">تسجيل الدخول / إنشاء حساب</button>`);
window.authPanel=()=>openSheet(`<h2>حساب Mivo Social</h2><input id="email" class="field" type="email" placeholder="البريد الإلكتروني"><input id="pass" class="field" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)"><input id="display" class="field" placeholder="الاسم (لإنشاء حساب)"><div class="row"><button class="primary" onclick="login()">دخول</button><button class="secondary" onclick="register()">إنشاء حساب</button></div><p class="small">فعّل Email/Password من Firebase Authentication.</p>`);
window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pass.value);closeModal();toast('تم تسجيل الدخول')}catch(e){toast(e.message)}};
window.register=async()=>{try{let c=await createUserWithEmailAndPassword(auth,email.value,pass.value);await setDoc(doc(db,'users',c.user.uid),{name:display.value||email.value.split('@')[0],email:email.value,createdAt:serverTimestamp()});closeModal();toast('تم إنشاء الحساب')}catch(e){toast(e.message)}};
window.go=(view,btn)=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn?.classList.add('active');if(view==='home'){document.getElementById('main').innerHTML=`<div class="stories" id="stories"></div><div class="composer"><div class="row"><img class="avatar" src="${avatar(12)}"><textarea id="postText" placeholder="وش يدور في بالك؟"></textarea></div><div class="row"><button class="secondary" onclick="pickImage()">＋ صورة</button><input id="imageFile" type="file" accept="image/*" hidden onchange="previewImage(event)"><span class="small" id="imageLabel"></span><span class="spacer"></span><button class="primary" onclick="publishPost()">نشر</button></div></div><div class="feed" id="feed"></div>`;renderStories();renderPosts(demoPosts)}else if(view==='profile'){document.getElementById('main').innerHTML=`<div class="profilehero"><img class="avatar" src="${avatar(12)}"><h2>${user?.displayName||user?.email?.split('@')[0]||'ملفك الشخصي'}</h2><div class="small">@${user?.email?.split('@')[0]||'mivo_user'}</div><div class="statrow"><div><strong>0</strong>منشور</div><div><strong>0</strong>متابع</div><div><strong>0</strong>يتابع</div></div><button class="primary" onclick="authPanel()">تسجيل / دخول</button> <button class="secondary" onclick="logout()">خروج</button></div>`}else{document.getElementById('main').innerHTML=`<div class="view"><div class="sectiontitle">${({search:'البحث',reels:'الفيديوهات القصيرة',communities:'المجتمعات'})[view]}</div><input class="field" placeholder="ابحث في Mivo Social"><div class="empty">هذه الصفحة ضمن واجهة الإصدار الأول.<br>نربطها بالخدمات الحقيقية في خطوات الإعداد التالية.</div></div>`}};
window.logout=async()=>{if(auth)await signOut(auth);user=null;toast('تم تسجيل الخروج');go('profile')};
try{if(firebaseConfig.apiKey.startsWith('YOUR_'))throw Error('Firebase غير مضبوط');app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app);onAuthStateChanged(auth,u=>{user=u;if(u){if(unsubscribe)unsubscribe();unsubscribe=onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(30)),snap=>{let posts=snap.docs.map(d=>({id:d.id,...d.data()}));if(document.getElementById('feed'))renderPosts(posts)});toast('أهلًا '+(u.displayName||u.email))}})}catch(e){console.info('Setup required:',e.message)}
if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
