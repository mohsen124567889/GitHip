<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110e"><title>M Chat</title><link rel="manifest" href="manifest.json"><style>body{margin:0;background:#07110e;color:#effaf4;font:16px system-ui;max-width:600px;margin:auto}.top{padding:18px;background:#0b1912;border-bottom:1px solid #20392d;font-size:24px;font-weight:bold}.top b{color:#20d49a}.box{padding:14px}.field{width:100%;box-sizing:border-box;background:#102019;border:1px solid #244333;border-radius:13px;padding:13px;color:white;margin:6px 0}.btn{background:#20d49a;color:#04140d;border:0;border-radius:12px;padding:12px;font-weight:bold;margin:4px}.list{padding:10px}.row{padding:15px;border-bottom:1px solid #20392d;cursor:pointer}.msgs{height:55vh;overflow:auto;padding:12px}.bubble{background:#14251e;padding:10px 14px;border-radius:15px;margin:8px;max-width:75%}.mine{background:#075c43;margin-right:auto}.send{display:flex;padding:10px;gap:8px}.send input{flex:1}.hide{display:none}</style><body><div class="top">M <b>Chat</b></div><section id="home"><div class="box"><button class="btn" onclick="authbox()">حساب / دخول</button><input id="emailTo" class="field" placeholder="بريد الطرف الآخر"><button class="btn" onclick="newchat()">＋ بدء محادثة</button></div><div id="chats" class="list">سجّل دخولك لعرض المحادثات</div></section><section id="chat" class="hide"><div class="box"><button class="btn" onclick="back()">رجوع</button><span id="who">محادثة</span></div><div id="msgs" class="msgs"></div><form class="send" onsubmit="send(event)"><input id="txt" class="field" placeholder="رسالة..."><button class="btn">إرسال</button></form></section><div id="modal" class="box hide"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,getDoc,addDoc,onSnapshot,query,where,orderBy,serverTimestamp,updateDoc,getDocs}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyD-mF_XCa1KeUUDQTmdH-VhRec81WervjA',authDomain:'webchat-e4b06.firebaseapp.com',databaseURL:'https://webchat-e4b06-default-rtdb.firebaseio.com',projectId:'webchat-e4b06',storageBucket:'webchat-e4b06.firebasestorage.app',messagingSenderId:'1046507368149',appId:'1:1046507368149:web:a78e1bc1af327499223c5c'};const a=initializeApp(cfg),auth=getAuth(a),db=getFirestore(a);let me=null,cid=null,stopChats=null,stopMsgs=null;const $=x=>document.getElementById(x);function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
window.authbox=()=>{$('modal').classList.remove('hide');$('modal').innerHTML='<h3>حساب M Chat</h3><input id="em" class="field" placeholder="البريد"><input id="pw" type="password" class="field" placeholder="كلمة المرور"><button class="btn" onclick="login()">دخول</button><button class="btn" onclick="reg()">إنشاء حساب</button><button class="btn" onclick="logout()">خروج</button>'};window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('em').value,$('pw').value);$('modal').classList.add('hide')}catch(e){alert(e.message)}};window.reg=async()=>{try{let u=await createUserWithEmailAndPassword(auth,$('em').value,$('pw').value);await setDoc(doc(db,'users',u.user.uid),{email:u.user.email,name:u.user.email.split('@')[0]});$('modal').classList.add('hide')}catch(e){alert(e.message)}};window.logout=()=>signOut(auth);onAuthStateChanged(auth,u=>{me=u;if(u)watchChats();else $('chats').textContent='سجّل دخولك لبدء الدردشة'});
function watchChats(){if(stopChats)stopChats();stopChats=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{$('chats').innerHTML=s.docs.map(d=>`<div class="row" onclick="openchat('${d.id}')">${esc(d.data().lastMessage||'محادثة جديدة')}<small> • دردشة</small></div>`).join('')||'لا توجد محادثات'});}
window.newchat=async()=>{if(!me)return authbox();let email=$('emailTo').value.trim().toLowerCase();if(!email)return alert('اكتب بريد الطرف الآخر');let q=await getDocs(query(collection(db,'users'),where('email','==',email)));if(q.empty)return alert('هذا البريد غير مسجل');let other=q.docs[0].id;if(other===me.uid)return alert('لا يمكنك مراسلة نفسك');let members=[me.uid,other].sort();cid=members.join('_');await setDoc(doc(db,'chats',cid),{members,lastMessage:'بدأت المحادثة',updatedAt:serverTimestamp()},{merge:true});openchat(cid);};window.openchat=cid0=>{cid=cid0;$('home').classList.add('hide');$('chat').classList.remove('hide');if(stopMsgs)stopMsgs();stopMsgs=onSnapshot(query(collection(db,'chats',cid,'messages'),orderBy('createdAt')),s=>{$('msgs').innerHTML=s.docs.map(d=>{let m=d.data();return `<div class="bubble ${m.sender===me.uid?'mine':''}">${esc(m.text)}</div>`}).join('');$('msgs').scrollTop=$('msgs').scrollHeight})};window.send=async e=>{e.preventDefault();let t=$('txt').value.trim();if(!t||!cid)return;await addDoc(collection(db,'chats',cid,'messages'),{text:t,sender:me.uid,createdAt:serverTimestamp(),type:'text'});await updateDoc(doc(db,'chats',cid),{lastMessage:t,updatedAt:serverTimestamp()});$('txt').value=''};window.back=()=>{$('chat').classList.add('hide');$('home').classList.remove('hide');cid=null};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
