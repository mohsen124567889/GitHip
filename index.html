<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b0e"><link rel="manifest" href="manifest.json"><title>M Chat</title>
<style>
:root{--bg:#080b0e;--panel:#10161b;--panel2:#151d23;--line:#25313a;--text:#f3f7f8;--muted:#8b9aa5;--green:#16c784;--gold:#c9a86a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#123328 0,transparent 36%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.header{padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1c292e;background:#090e11e8;position:sticky;top:0;z-index:4;backdrop-filter:blur(16px)}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#20d99b,#087c54);display:grid;place-items:center;color:#04150e;font-weight:900;font-size:22px;box-shadow:0 8px 24px #16c78425}.brand{font-size:21px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--green)}.sub{font-size:12px;color:var(--muted)}.headright{margin-right:auto;display:flex;gap:8px}.iconbtn{border:1px solid var(--line);background:var(--panel);color:#dce8e9;border-radius:13px;width:42px;height:42px}.main{padding:20px;flex:1}.welcome{padding:22px;border:1px solid #244336;background:linear-gradient(135deg,#10251d,#11181d 70%);border-radius:24px;margin-bottom:18px}.welcome h2{margin:0 0 8px;font-size:24px}.welcome p{color:#a8b8b2;margin:0;font-size:13px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px;font-weight:700}.pill{color:#8ce8bf;background:#113327;border:1px solid #20513c;border-radius:99px;padding:5px 10px;font-size:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px;margin:10px 0}.field{width:100%;padding:14px 15px;background:#0a1014;border:1px solid #2a373c;color:white;border-radius:13px;outline:none;margin:6px 0}.field:focus{border-color:#1aa977;box-shadow:0 0 0 3px #16c78414}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:750;background:var(--green);color:#03170e}.btn.secondary{background:#1a252a;color:#dce9e9;border:1px solid #2b3b41}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1}.chatrow{display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;border:1px solid transparent;background:#10161b;margin:8px 0;cursor:pointer}.avatar{width:48px;height:48px;flex-shrink:0;border-radius:16px;background:linear-gradient(145deg,#183c2c,#18252b);display:grid;place-items:center;color:#8ee7bd;font-weight:800;font-size:18px}.chatmeta{flex:1;min-width:0}.chatname{font-weight:700}.preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.time{font-size:11px;color:var(--muted)}.hide{display:none!important}.chathead{display:flex;align-items:center;gap:10px;padding:12px 0}.chathead .info{flex:1}.messages{height:calc(100dvh - 260px);min-height:300px;overflow:auto;padding:12px 2px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;padding:11px 14px;border-radius:17px 17px 5px 17px;background:#172127;border:1px solid #26353c;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#075b40,#0b7650);border-color:#167c58;border-radius:17px 17px 17px 5px}.stamp{display:block;font-size:10px;color:#b1c9be;text-align:left;margin-top:5px}.composer{display:flex;gap:8px;align-items:center;padding:10px 0;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%)}.composer input{flex:1;min-width:0;margin:0}.sendbtn{width:48px;height:48px;border-radius:15px;border:0;background:var(--green);color:#042015;font-weight:900}.nav{display:flex;justify-content:space-around;padding:12px 6px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #1c292e;background:#090e11}.nav button{background:none;border:0;color:#81919a;font-size:12px}.nav button.active{color:var(--green)}.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px;z-index:10}.modalbox{width:min(100%,430px);background:#11191e;border:1px solid #2b3b40;border-radius:24px;padding:22px;box-shadow:0 30px 100px #0008}.modalbox h3{margin-top:0}.call{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#174332,#080c10 58%);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;text-align:center}.callavatar{width:120px;height:120px;border-radius:40px;background:linear-gradient(145deg,#1d5a3f,#17232b);display:grid;place-items:center;font-size:48px;color:#a3f4cd;border:1px solid #3d775a}.callname{font-size:27px;font-weight:800;margin-top:24px}.callstatus{color:#9db6aa;margin:8px}.callactions{display:flex;gap:24px;margin-top:65px}.callactions button{width:64px;height:64px;border-radius:50%;border:0;background:#27343a;color:white;font-size:22px}.callactions .end{background:#ed4556}.callactions .accept{background:#16c784;color:#052016}.notice{color:#f4c879;font-size:12px;line-height:1.7}.empty{text-align:center;color:var(--muted);padding:30px 12px}
</style></head><body><div class="app">
<header class="header"><div class="logo">M</div><div><div class="brand">M <span>Chat</span></div><div class="sub">محادثاتك، أقرب وأجمل</div></div><div class="headright"><button class="iconbtn" title="حساب" onclick="authModal()">♙</button><button class="iconbtn" title="إعدادات" onclick="settingsModal()">⚙</button></div></header>
<section id="home" class="main"><div class="welcome"><h2>أهلاً بك في <span style="color:var(--green)">M Chat</span></h2><p>مساحة خاصة تجمعك بمن تحب — دردشة مباشرة بتصميم أنيق.</p></div><div class="card"><div class="sectiontitle" style="margin-top:0">ابدأ محادثة جديدة <span class="pill">خاص</span></div><input id="emailTo" class="field" type="email" placeholder="البريد الإلكتروني للطرف الآخر"><button class="btn" style="width:100%;margin-top:8px" onclick="newChat()">＋ إنشاء محادثة</button></div><div class="sectiontitle">محادثاتك <span class="pill" id="count">0</span></div><div id="chats"><div class="empty">سجّل دخولك لتظهر محادثاتك هنا</div></div></section>
<section id="chatview" class="main hide"><div class="chathead"><button class="iconbtn" onclick="backHome()">→</button><div class="avatar" id="chatAvatar">M</div><div class="info"><div class="chatname" id="chatName">محادثة</div><div class="sub" id="chatState">محادثة خاصة</div></div><button class="iconbtn" onclick="startCall()" title="اتصال صوتي">☎</button></div><div class="messages" id="messages"></div><div class="composer"><button class="iconbtn" onclick="recordVoice()" title="رسالة صوتية">🎙</button><input id="message" class="field" placeholder="اكتب رسالة…" autocomplete="off"><button class="sendbtn" onclick="sendMessage()">➤</button></div></section>
<nav class="nav"><button class="active" onclick="backHome()">⌂<br>الرئيسية</button><button onclick="authModal()">♙<br>حسابي</button><button onclick="settingsModal()">⚙<br>الإعدادات</button></nav></div>
<div id="modal" class="modal hide" onclick="if(event.target===this)closeModal()"><div class="modalbox" id="modalbox"></div></div><div id="callui" class="call hide"><div class="callavatar" id="callAvatar">M</div><div class="callname" id="callName">M Chat</div><div class="callstatus" id="callStatus">جارٍ الاتصال…</div><div class="callactions" id="callActions"><button onclick="toggleMute()">♩</button><button class="end" onclick="endCall()">✕</button></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';import{getFirestore,collection,doc,setDoc,getDoc,addDoc,onSnapshot,query,where,orderBy,serverTimestamp,updateDoc,getDocs,deleteDoc}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';import{getStorage,ref,uploadBytes,getDownloadURL}from'https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js';
const cfg={apiKey:'AIzaSyD-mF_XCa1KeUUDQTmdH-VhRec81WervjA',authDomain:'webchat-e4b06.firebaseapp.com',projectId:'webchat-e4b06',storageBucket:'webchat-e4b06.firebasestorage.app',messagingSenderId:'1046507368149',appId:'1:1046507368149:web:a78e1bc1af327499223c5c'};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);const $=id=>document.getElementById(id);let me=null,current=null,other=null,chatStop=null,msgStop=null,rtc=null,localStream=null,callDoc=null,recorder=null,chunks=[],muted=false,callTimer=null;const pcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
window.closeModal=()=> $('modal').classList.add('hide');window.authModal=()=>{$('modal').classList.remove('hide');$('modalbox').innerHTML=`<h3>حساب M Chat</h3><p class="sub">دخولك يزامن محادثاتك على أجهزتك</p><input id="authEmail" class="field" type="email" placeholder="البريد الإلكتروني"><input id="authPass" class="field" type="password" placeholder="كلمة المرور (6 أحرف فأكثر)"><div class="btnrow"><button class="btn" onclick="login()">دخول</button><button class="btn secondary" onclick="register()">إنشاء حساب</button></div><button class="btn ghost" style="width:100%;margin-top:10px" onclick="logout()">تسجيل خروج</button>`};window.login=async()=>{try{await signInWithEmailAndPassword(auth,$('authEmail').value,$('authPass').value);closeModal()}catch(e){alert(errorText(e))}};window.register=async()=>{try{let u=await createUserWithEmailAndPassword(auth,$('authEmail').value,$('authPass').value);await setDoc(doc(db,'users',u.user.uid),{uid:u.user.uid,email:u.user.email,name:u.user.email.split('@')[0],createdAt:serverTimestamp(),online:true},{merge:true});closeModal()}catch(e){alert(errorText(e))}};window.logout=async()=>{if(me)await setDoc(doc(db,'users',me.uid),{online:false,lastSeen:serverTimestamp()},{merge:true});await signOut(auth);closeModal()};function errorText(e){return ({'auth/invalid-credential':'بيانات الدخول غير صحيحة','auth/email-already-in-use':'البريد مستخدم مسبقًا','auth/weak-password':'كلمة المرور ضعيفة، استخدم 6 أحرف على الأقل','auth/invalid-email':'البريد الإلكتروني غير صحيح'})[e.code]||e.message}
onAuthStateChanged(auth,async u=>{me=u;if(u){await setDoc(doc(db,'users',u.uid),{uid:u.uid,email:u.email,online:true,lastSeen:serverTimestamp()},{merge:true});watchChats();watchIncoming()}else{$('chats').innerHTML='<div class="empty">سجّل دخولك من زر الحساب لبدء الدردشة</div>'}});

let incomingStop=null;function watchIncoming(){if(incomingStop)incomingStop();incomingStop=onSnapshot(query(collection(db,'calls'),where('callee','==',me.uid),where('status','==','ringing')),s=>{s.docChanges().forEach(async ch=>{if(ch.type==='added'){let c=ch.doc.data();$('callui').classList.remove('hide');$('callName').textContent='اتصال وارد';$('callStatus').textContent='مكالمة صوتية واردة';$('callActions').innerHTML=`<button class="accept" onclick="acceptCall('${ch.doc.id}')">✓</button><button class="end" onclick="rejectCall('${ch.doc.id}')">✕</button>`}})})};window.rejectCall=async id=>{await updateDoc(doc(db,'calls',id),{status:'ended'});$('callui').classList.add('hide')};
function watchChats(){if(chatStop)chatStop();chatStop=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),async snap=>{let arr=[];for(const d of snap.docs){let x=d.data(),uid=x.members.find(v=>v!==me.uid),u=await getDoc(doc(db,'users',uid));arr.push({id:d.id,...x,peer:u.exists()?u.data():{email:'مستخدم'}})}$('count').textContent=arr.length;$('chats').innerHTML=arr.length?arr.map(c=>`<div class="chatrow" onclick="openChat('${c.id}','${c.members.find(v=>v!==me.uid)}','${esc(c.peer.name||c.peer.email)}')"><div class="avatar">${esc((c.peer.name||c.peer.email||'M')[0].toUpperCase())}</div><div class="chatmeta"><div class="chatname">${esc(c.peer.name||c.peer.email)}</div><div class="preview">${esc(c.lastMessage||'ابدأ المحادثة')}</div></div><div class="time">${c.updatedAt?.toDate?c.updatedAt.toDate().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):''}</div></div>`).join(''):'<div class="empty">لا توجد محادثات بعد — ابدأ محادثة جديدة بالأعلى</div>'})}
window.newChat=async()=>{if(!me)return authModal();let email=$('emailTo').value.trim().toLowerCase();if(!email)return alert('أدخل بريد الطرف الآخر');try{let s=await getDocs(query(collection(db,'users'),where('email','==',email)));if(s.empty)return alert('الحساب غير موجود، اطلب منه التسجيل أولاً');let uid=s.docs[0].id;if(uid===me.uid)return alert('لا يمكنك بدء محادثة مع نفسك');let members=[me.uid,uid].sort(),id=members.join('_');await setDoc(doc(db,'chats',id),{members,lastMessage:'محادثة جديدة',updatedAt:serverTimestamp()},{merge:true});openChat(id,uid,s.docs[0].data().name||email)}catch(e){alert(errorText(e))}};
window.openChat=(id,uid,name)=>{current=id;other=uid;$('home').classList.add('hide');$('chatview').classList.remove('hide');$('chatName').textContent=name;$('chatAvatar').textContent=(name||'M')[0];if(msgStop)msgStop();msgStop=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('createdAt')),s=>{$('messages').innerHTML=s.docs.map(d=>{let m=d.data(),mine=m.sender===me.uid,content=m.type==='audio'?`<audio controls src="${esc(m.url)}"></audio>`:m.type==='image'?`<a href="${esc(m.url)}" target="_blank"><img style="max-width:210px;border-radius:12px" src="${esc(m.url)}"></a>`:esc(m.text);return `<div class="bubble ${mine?'mine':''}">${content}<span class="stamp">${mine?'✓✓':''} ${m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}):''}</span></div>`}).join('');$('messages').scrollTop=$('messages').scrollHeight})};window.backHome=()=>{$('chatview').classList.add('hide');$('home').classList.remove('hide');current=null;if(msgStop)msgStop()};window.sendMessage=async()=>{let text=$('message').value.trim();if(!text||!current)return;try{await addDoc(collection(db,'chats',current,'messages'),{text,sender:me.uid,type:'text',createdAt:serverTimestamp()});await updateDoc(doc(db,'chats',current),{lastMessage:text,updatedAt:serverTimestamp()});$('message').value=''}catch(e){alert(errorText(e))}};$('message').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage()});
window.recordVoice=async()=>{if(!current)return;try{if(recorder?.state==='recording'){recorder.stop();return}let stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{let blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'}),r=ref(storage,`voice/${current}/${Date.now()}.webm`);try{await uploadBytes(r,blob);let url=await getDownloadURL(r);await addDoc(collection(db,'chats',current,'messages'),{sender:me.uid,type:'audio',url,createdAt:serverTimestamp()});await updateDoc(doc(db,'chats',current),{lastMessage:'🎙 رسالة صوتية',updatedAt:serverTimestamp()})}catch(e){alert('تعذر رفع الصوت: '+e.message)}stream.getTracks().forEach(t=>t.stop())};recorder.start();alert('جاري التسجيل… اضغط زر الميكروفون مرة ثانية للإرسال')}catch(e){alert('اسمح بالوصول إلى الميكروفون من إعدادات المتصفح')}};
// WebRTC audio call signaling through Firestore; requires Firebase rules permitting call docs.
window.startCall=async()=>{if(!me||!current)return;try{localStream=await navigator.mediaDevices.getUserMedia({audio:true});rtc=new RTCPeerConnection(pcConfig);localStream.getTracks().forEach(t=>rtc.addTrack(t,localStream));rtc.ontrack=e=>{let a=$('remoteAudio')||document.createElement('audio');a.id='remoteAudio';a.autoplay=true;a.playsInline=true;a.srcObject=e.streams[0];document.body.appendChild(a)};callDoc=doc(collection(db,'calls'));let offerCandidates=collection(callDoc,'offerCandidates'),answerCandidates=collection(callDoc,'answerCandidates');rtc.onicecandidate=e=>{if(e.candidate)addDoc(offerCandidates,e.candidate.toJSON())};let offer=await rtc.createOffer();await rtc.setLocalDescription(offer);await setDoc(callDoc,{chatId:current,caller:me.uid,callee:other,offer:{type:offer.type,sdp:offer.sdp},status:'ringing',createdAt:serverTimestamp()});$('callui').classList.remove('hide');$('callName').textContent=$('chatName').textContent;$('callStatus').textContent='جاري الاتصال بالطرف الآخر…';$('callActions').innerHTML='<button onclick="toggleMute()">♩</button><button class="end" onclick="endCall()">✕</button>';onSnapshot(callDoc,async s=>{let d=s.data();if(!rtc||!d)return;if(d.answer&&!rtc.currentRemoteDescription)await rtc.setRemoteDescription(new RTCSessionDescription(d.answer));if(d.status==='accepted')$('callStatus').textContent='متصل • مكالمة صوتية';if(d.status==='ended')endCall(false)});onSnapshot(answerCandidates,s=>s.docChanges().forEach(async c=>{if(c.type==='added'&&rtc)try{await rtc.addIceCandidate(new RTCIceCandidate(c.doc.data()))}catch{}}))}catch(e){alert('تعذر بدء المكالمة: '+e.message);endCall()}};
window.acceptCall=async id=>{callDoc=doc(db,'calls',id);let d=(await getDoc(callDoc)).data();localStream=await navigator.mediaDevices.getUserMedia({audio:true});rtc=new RTCPeerConnection(pcConfig);localStream.getTracks().forEach(t=>rtc.addTrack(t,localStream));rtc.ontrack=e=>{let a=document.createElement('audio');a.autoplay=true;a.srcObject=e.streams[0];document.body.appendChild(a)};rtc.onicecandidate=e=>e.candidate&&addDoc(collection(callDoc,'answerCandidates'),e.candidate.toJSON());await rtc.setRemoteDescription(new RTCSessionDescription(d.offer));let answer=await rtc.createAnswer();await rtc.setLocalDescription(answer);await updateDoc(callDoc,{answer:{type:answer.type,sdp:answer.sdp},status:'accepted'});$('callui').classList.remove('hide');$('callName').textContent='M Chat';$('callStatus').textContent='متصل • مكالمة صوتية';$('callActions').innerHTML='<button onclick="toggleMute()">♩</button><button class="end" onclick="endCall()">✕</button>';onSnapshot(collection(callDoc,'offerCandidates'),s=>s.docChanges().forEach(c=>c.type==='added'&&rtc.addIceCandidate(new RTCIceCandidate(c.doc.data()))))};window.toggleMute=()=>{muted=!muted;localStream?.getAudioTracks().forEach(t=>t.enabled=!muted);$('callStatus').textContent=muted?'تم كتم الميكروفون':'مكالمة صوتية'};window.endCall=async(remote=true)=>{try{if(remote&&callDoc)await updateDoc(callDoc,{status:'ended'})}catch{};rtc?.close();rtc=null;localStream?.getTracks().forEach(t=>t.stop());localStream=null;$('callui').classList.add('hide');document.getElementById('remoteAudio')?.remove();callDoc=null};
window.settingsModal=()=>{$('modal').classList.remove('hide');$('modalbox').innerHTML=`<h3>إعدادات M Chat</h3><div class="card"><b>الحساب</b><p class="sub">${esc(me?.email||'غير مسجل')}</p><button class="btn secondary" onclick="authModal()">إدارة الحساب</button></div><p class="notice">لعمل المكالمات والرسائل الصوتية يلزم HTTPS (GitHub Pages مناسب) والسماح بالميكروفون. المكالمات قد تحتاج TURN server في بعض الشبكات.</p><button class="btn ghost" style="width:100%" onclick="closeModal()">إغلاق</button>`};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
